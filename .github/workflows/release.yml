name: release

# 打标签即发版：git tag v1.2.1 && git push origin v1.2.1
# 也可以在 Actions 里手动跑，填一个版本号。
# 自动产出两个包：LAN 局域网版（不含 deploy-public）与公网部署版（含 deploy-public）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号，例如 v1.2.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  packages:
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile print_server.py

      - name: Import
        run: python -c "import print_server; print('import ok')"

      - name: Build the two packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_release.py $env:TAG
          Get-ChildItem dist | Format-Table Name, Length | Out-String | Write-Output
          Get-Content dist/sums.env | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lanZip = Join-Path 'dist' "family-lan-printer-lan-$env:TAG.zip"
          $pubZip = Join-Path 'dist' "family-lan-printer-public-$env:TAG.zip"

          # 已存在就更新附件和说明（重跑同一个 tag 时走这条路）
          $prev = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $env:TAG 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prev

          if ($exists) {
            gh release upload $env:TAG $lanZip $pubZip --clobber
            gh release edit $env:TAG --notes-file dist/release-notes.md
            Write-Output "updated existing release $env:TAG"
          } else {
            gh release create $env:TAG `
              --title "家庭内网打印 $env:TAG · 局域网版 / 公网部署版" `
              --notes-file dist/release-notes.md `
              $lanZip $pubZip
            Write-Output "created release $env:TAG"
          }

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.TAG }}
          path: dist/*.zip
          if-no-files-found: error
