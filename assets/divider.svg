<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="34" viewBox="0 0 1280 34" role="img" aria-label="分隔线">
  <defs>
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B3D61" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#4C8DFF" stop-opacity="0.55"/>
      <stop offset="0.78" stop-color="#4C8DFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1B3D61" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="travel2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EAF3FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="16" width="1280" height="1.5" fill="url(#line2)"/>
  <rect x="-180" y="15" width="180" height="3.5" fill="url(#travel2)">
    <animate attributeName="x" values="-180;1280" dur="5s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(640 16)">
    <path d="M-9 -4 h18 v8 l-6 6 h-12 z" fill="#061428" stroke="#7FB2FF" stroke-width="1.4"/>
    <path d="M3 4 v6 h6" fill="none" stroke="#7FB2FF" stroke-width="1.2" opacity="0.7"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#4C8DFF" stroke-width="1" opacity="0.35">
      <animate attributeName="r" values="10;18;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
