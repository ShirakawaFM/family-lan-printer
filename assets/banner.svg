<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="家庭内网打印：微信扫码，打印文字、照片和文件">
  <title>家庭内网打印 · 微信扫码即可打印</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061428"/>
      <stop offset="0.55" stop-color="#08203C"/>
      <stop offset="1" stop-color="#0A2A4A"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pglow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC46B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ptitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E6F1FF"/>
      <stop offset="1" stop-color="#7FB2FF"/>
    </linearGradient>
    <linearGradient id="pbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CC4FF"/>
      <stop offset="1" stop-color="#2A5FA8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE8F8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27507C"/>
      <stop offset="1" stop-color="#122B49"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2B4E78"/>
    </pattern>
    <clipPath id="paperClip">
      <rect x="0" y="0" width="1280" height="246"/>
    </clipPath>
    <clipPath id="phoneScreen">
      <rect x="4" y="10" width="78" height="118" rx="6"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#pbg)"/>
  <rect width="1280" height="420" fill="url(#dots)" opacity="0.45"/>
  <rect width="1280" height="420" fill="url(#pglow)"/>
  <circle cx="1040" cy="320" r="210" fill="url(#pglow2)"/>

  <rect x="0" y="0" width="6" height="420" fill="url(#pbar)"/>
  <rect x="0" y="0" width="6" height="420" fill="#CFE2FF" opacity="0.3">
    <animate attributeName="opacity" values="0.08;0.6;0.08" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <text x="74" y="88" fill="#7FB2FF" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="4.5">SHIRAKAWAFM / FAMILY LAN PRINT</text>

  <text y="196" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="74" font-weight="800">
    <tspan x="72" fill="url(#ptitle)">家庭内网打印</tspan>
  </text>

  <text x="74" y="246" fill="#E8F2FF" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="700">微信扫一扫，打印机自己开始干活</text>
  <text x="74" y="284" fill="#8FA9C9" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">不装 App、不注册账号、不上传云端：手机连家里 WiFi，扫码就能打文字、照片和文件</text>

  <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">
    <g>
      <rect x="72" y="322" width="104" height="38" rx="19" fill="#0E2C4E" stroke="#2C5F9E"/>
      <text x="94" y="347" fill="#CFE0FF">Windows</text>
    </g>
    <g>
      <rect x="188" y="322" width="140" height="38" rx="19" fill="#0E2C4E" stroke="#2C5F9E"/>
      <text x="210" y="347" fill="#CFE0FF">单文件 Python</text>
    </g>
    <g>
      <rect x="340" y="322" width="128" height="38" rx="19" fill="#0E2C4E" stroke="#2C5F9E"/>
      <text x="362" y="347" fill="#CFE0FF">PDF / Office</text>
    </g>
    <g>
      <rect x="480" y="322" width="130" height="38" rx="19" fill="#0E2C4E" stroke="#2C5F9E"/>
      <text x="502" y="347" fill="#CFE0FF">A4 宋体 24</text>
    </g>
    <g>
      <rect x="622" y="322" width="124" height="38" rx="19" fill="#0E2C4E" stroke="#2C5F9E"/>
      <text x="644" y="347" fill="#CFE0FF">串行队列</text>
    </g>
  </g>

