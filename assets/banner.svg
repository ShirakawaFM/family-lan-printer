      <g fill="#0B2340">
        <rect x="14" y="20" width="18" height="18" rx="2"/><rect x="18.5" y="24.5" width="9" height="9" fill="#F2F7FF"/>
        <rect x="54" y="20" width="18" height="18" rx="2"/><rect x="58.5" y="24.5" width="9" height="9" fill="#F2F7FF"/>
        <rect x="14" y="64" width="18" height="18" rx="2"/><rect x="18.5" y="68.5" width="9" height="9" fill="#F2F7FF"/>
        <rect x="37" y="20" width="5" height="5"/><rect x="45" y="27" width="5" height="5"/>
        <rect x="37" y="38" width="5" height="5"/><rect x="45" y="46" width="5" height="5"/>
        <rect x="55" y="50" width="5" height="5"/><rect x="64" y="44" width="5" height="5"/>
        <rect x="37" y="66" width="5" height="5"/><rect x="47" y="74" width="5" height="5"/>
        <rect x="57" y="66" width="5" height="5"/><rect x="66" y="76" width="5" height="5"/>
        <rect x="37" y="96" width="5" height="5"/><rect x="47" y="106" width="5" height="5"/>
        <rect x="57" y="96" width="5" height="5"/><rect x="67" y="106" width="5" height="5"/>
      </g>
      <rect x="4" y="10" width="78" height="3" fill="#2BE8C4">
        <animate attributeName="y" values="10;125;10" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="34" y="132" width="18" height="3" rx="1.5" fill="#7FA3CB"/>
    <text x="43" y="158" text-anchor="middle" fill="#9FC0E8" font-family="'PingFang SC', sans-serif" font-size="12">微信扫码</text>
  </g>

  <path d="M868 150 C900 168 906 210 918 246" fill="none" stroke="#4C8DFF" stroke-width="2" stroke-dasharray="6 7" opacity="0.65">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <g clip-path="url(#paperClip)">
    <rect x="934" y="132" width="226" height="122" rx="6" fill="url(#paper)" stroke="#C7D8EC">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 -16;0 0" keyTimes="0;0.42;0.78;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g fill="#9DB0C6">
      <rect x="954" y="156" width="132" height="7" rx="3.5">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 -16;0 0" keyTimes="0;0.42;0.78;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="954" y="174" width="186" height="7" rx="3.5">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 -16;0 0" keyTimes="0;0.42;0.78;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="954" y="192" width="160" height="7" rx="3.5">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 -16;0 0" keyTimes="0;0.42;0.78;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="954" y="210" width="112" height="7" rx="3.5" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 -16;0 0" keyTimes="0;0.42;0.78;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g>
    <rect x="900" y="248" width="310" height="104" rx="16" fill="url(#bodyGrad)" stroke="#3A6A9C" stroke-width="1.5"/>
    <rect x="900" y="248" width="310" height="16" rx="8" fill="#2E5686" opacity="0.85"/>
    <rect x="928" y="242" width="252" height="10" rx="5" fill="#08172A"/>
    <rect x="922" y="278" width="112" height="40" rx="6" fill="#0A1829" stroke="#2F5480"/>
    <text x="934" y="304" fill="#2BE8C4" font-family="Consolas, monospace" font-size="13">PRINTING</text>
    <circle cx="924" cy="304" r="3" fill="#2BE8C4">
