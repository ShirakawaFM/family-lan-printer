<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="一次打印的完整链路：手机扫码 → Flask 路由 → 串行队列 → 打印线程 → 默认打印机">
  <title>一次打印的完整链路</title>
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061428"/>
      <stop offset="1" stop-color="#0A2542"/>
    </linearGradient>
    <linearGradient id="qb1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB2FF"/><stop offset="1" stop-color="#1B4C86"/></linearGradient>
    <linearGradient id="qb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8DFF"/><stop offset="1" stop-color="#123A6B"/></linearGradient>
    <linearGradient id="qb3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2BE8C4"/><stop offset="1" stop-color="#0F5A57"/></linearGradient>
    <linearGradient id="qb4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC46B"/><stop offset="1" stop-color="#7A5410"/></linearGradient>
    <linearGradient id="qb5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9B7A"/><stop offset="1" stop-color="#7C3418"/></linearGradient>
    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BE8C4"/>
      <stop offset="0.6" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#qbg)"/>
  <rect width="1280" height="420" fill="none" stroke="#12365C" stroke-width="2"/>

  <text x="28" y="38" fill="#7FB2FF" font-family="Consolas, monospace" font-size="15" letter-spacing="4">ONE PRINT / 从扫码到出纸</text>
  <text x="1252" y="38" text-anchor="end" fill="#3F6A93" font-family="Consolas, monospace" font-size="13">单文件 Flask · 无前端构建 · 无数据库</text>

  <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect x="28" y="66" width="226" height="112" rx="14" fill="#0A1A2C" stroke="#22527F"/>
      <rect x="28" y="66" width="4" height="112" rx="2" fill="url(#qb1)"/>
      <rect x="28" y="66" width="226" height="112" rx="14" fill="none" stroke="#7FB2FF" stroke-width="1.5" opacity="0.25">
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="98" fill="#6C93B8" font-family="Consolas, monospace" font-size="12">01 / 手机</text>
      <text x="50" y="128" fill="#F0F6FF" font-size="18" font-weight="700">扫墙上的二维码</text>
      <text x="50" y="152" fill="#8FA9C9" font-size="13">同一 WiFi · 输入全家共用密码</text>
    </g>

    <g>
      <rect x="280" y="66" width="226" height="112" rx="14" fill="#0A1A2C" stroke="#22527F"/>
      <rect x="280" y="66" width="4" height="112" rx="2" fill="url(#qb2)"/>
      <rect x="280" y="66" width="226" height="112" rx="14" fill="none" stroke="#4C8DFF" stroke-width="1.5" opacity="0.25">
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="7s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="302" y="98" fill="#6C93B8" font-family="Consolas, monospace" font-size="12">02 / Flask</text>
      <text x="302" y="128" fill="#F0F6FF" font-size="18" font-weight="700">路由 + 校验</text>
      <text x="302" y="152" fill="#8FA9C9" font-size="13">后缀 / 8MB / 50MB / 真能打开</text>
    </g>

    <g>
      <rect x="532" y="66" width="226" height="112" rx="14" fill="#0A1A2C" stroke="#22527F"/>
      <rect x="532" y="66" width="4" height="112" rx="2" fill="url(#qb3)"/>
      <rect x="532" y="66" width="226" height="112" rx="14" fill="none" stroke="#2BE8C4" stroke-width="1.5" opacity="0.25">
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="7s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <text x="554" y="98" fill="#6C93B8" font-family="Consolas, monospace" font-size="12">03 / 内存</text>
      <text x="554" y="128" fill="#F0F6FF" font-size="18" font-weight="700">串行队列</text>
      <text x="554" y="152" fill="#8FA9C9" font-size="13">queue.Queue · 严格 FIFO</text>
    </g>

    <g>
      <rect x="784" y="66" width="226" height="112" rx="14" fill="#0A1A2C" stroke="#22527F"/>
      <rect x="784" y="66" width="4" height="112" rx="2" fill="url(#qb4)"/>
      <rect x="784" y="66" width="226" height="112" rx="14" fill="none" stroke="#FFC46B" stroke-width="1.5" opacity="0.25">
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="7s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
      <text x="806" y="98" fill="#6C93B8" font-family="Consolas, monospace" font-size="12">04 / 线程</text>
      <text x="806" y="128" fill="#F0F6FF" font-size="18" font-weight="700">唯一的 print-worker</text>
      <text x="806" y="152" fill="#8FA9C9" font-size="13">Pillow 排版 · pypdfium2 渲染</text>
    </g>

    <g>
      <rect x="1036" y="66" width="216" height="112" rx="14" fill="#0A1A2C" stroke="#22527F"/>
      <rect x="1036" y="66" width="4" height="112" rx="2" fill="url(#qb5)"/>
      <rect x="1036" y="66" width="216" height="112" rx="14" fill="none" stroke="#FF9B7A" stroke-width="1.5" opacity="0.25">
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="7s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="1058" y="98" fill="#6C93B8" font-family="Consolas, monospace" font-size="12">05 / 出纸</text>
      <text x="1058" y="128" fill="#F0F6FF" font-size="18" font-weight="700">默认打印机</text>
      <text x="1058" y="152" fill="#8FA9C9" font-size="13">pywin32 · A4 · 300 DPI</text>
    </g>
  </g>

  <g fill="none" stroke="#2F6C9E" stroke-width="2" stroke-dasharray="7 6">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.4s" repeatCount="indefinite"/>
    <path d="M254 122 H276"/>
    <path d="M506 122 H528"/>
    <path d="M758 122 H780"/>
    <path d="M1010 122 H1032"/>
  </g>
  <g fill="#4C8DFF">
    <path d="M276 116 L286 122 L276 128 Z"/>
    <path d="M528 116 L538 122 L528 128 Z"/>
    <path d="M780 116 L790 122 L780 128 Z"/>
    <path d="M1032 116 L1042 122 L1032 128 Z"/>
  </g>

  <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#8FA9C9">
    <text x="28" y="216">手机端每 1 秒 GET /status/{id} 轮询一次，拿到的只有「排队中 / 已提交 / 失败原因」，不返回任何画面或文件内容</text>
  </g>

  <g transform="translate(28 250)">
    <text x="0" y="0" fill="#7FB2FF" font-family="Consolas, monospace" font-size="13" letter-spacing="3">LIFECYCLE / 临时文件的 30 秒</text>

    <rect x="0" y="20" width="1224" height="10" rx="5" fill="#0E2742"/>
    <rect x="0" y="20" width="1224" height="10" rx="5" fill="url(#timeline)" opacity="0.9"/>

    <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8FA9C9">
      <text x="0" y="56">提交</text>
      <text x="240" y="56">写入 temp_print/</text>
      <text x="520" y="56">出纸</text>
      <text x="760" y="56">任务结束 +30s</text>
      <text x="1010" y="56">目录清空</text>
    </g>

    <g>
      <circle cx="8" cy="25" r="6" fill="#2BE8C4"/>
      <circle cx="240" cy="25" r="6" fill="#4C8DFF"/>
      <circle cx="520" cy="25" r="6" fill="#7FB2FF"/>
      <circle cx="760" cy="25" r="6" fill="#FFC46B"/>
      <circle cx="1010" cy="25" r="6" fill="#FF9B7A"/>
      <circle cx="1216" cy="25" r="6" fill="#2BE8C4"/>
    </g>

    <rect x="0" y="20" width="0" height="10" fill="#FFFFFF" opacity="0.28">
      <animate attributeName="width" values="0;1224;1224" keyTimes="0;0.75;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <text x="0" y="96" fill="#4C7CA6" font-family="Consolas, monospace" font-size="12">只预览没打印的文件：30 分钟后清理 · 失败也一样清 · 没有回收站，没有副本</text>
  </g>

  <text x="28" y="404" fill="#3F6A93" font-family="Consolas, monospace" font-size="13">不用云、不排队在浏览器里、不并发——所有任务都在同一台 Windows 机器上按顺序出纸</text>
</svg>
